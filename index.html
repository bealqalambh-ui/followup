<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>متابعة طلاب بالقلم</title></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: a working tool — sticky top bar, list on one side, editor + live sheet preview on the other; stacks on phones */
:root{
  --bg:#FBFAF6; --surface:#FFFFFF; --ink:#16130E; --muted:#6B6253; --line:#E9E2D0;
  --gold:#E8C04E; --gold-soft:#FBF3D9; --gold-ink:#5A4300;
  --ok:#2F7D4F; --ok-soft:#E3F2E8; --warn:#9A6A00; --warn-soft:#FFF4D6; --info:#2C5C8A; --info-soft:#E4EEF8;
  --display:'Noto Kufi Arabic',Tahoma,sans-serif; --body:'IBM Plex Sans Arabic',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15130F; --surface:#1E1B16; --ink:#F3EEE3; --muted:#B4AA97; --line:#36302A;
  --gold:#E8C04E; --gold-soft:#3A3120; --gold-ink:#F2D58A;
  --ok:#7FCB9C; --ok-soft:#1E3326; --warn:#F0C665; --warn-soft:#3A3020; --info:#8DB8E6; --info-soft:#1E2A38; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15130F; --surface:#1E1B16; --ink:#F3EEE3; --muted:#B4AA97; --line:#36302A;
  --gold:#E8C04E; --gold-soft:#3A3120; --gold-ink:#F2D58A;
  --ok:#7FCB9C; --ok-soft:#1E3326; --warn:#F0C665; --warn-soft:#3A3020; --info:#8DB8E6; --info-soft:#1E2A38; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.4;text-wrap:balance}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.top img{height:40px;width:auto;display:block}
.top h1{font-size:18px}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.c-none{background:var(--line);color:var(--muted)}
.c-draft{background:var(--warn-soft);color:var(--warn)}
.c-ready{background:var(--info-soft);color:var(--info)}
.c-sent{background:var(--ok-soft);color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--gold)}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
a.btn.pri{color:#16130E}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#16130E}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
select,input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
main{padding-block:22px 60px}
.note{background:var(--gold-soft);color:var(--gold-ink);border-radius:10px;padding:10px 14px;font-size:14px}
/* login */
.login{max-width:760px;margin:30px auto;display:flex;flex-direction:column;gap:18px}
.login h2{font-size:26px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tcard{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:right;display:flex;flex-direction:column;gap:4px}
.tcard:hover{border-color:var(--gold)}
.tcard b{font-family:var(--display);font-size:17px}
.tcard span{color:var(--muted);font-size:13px}
.tcard.rec{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tcard.rec span{color:inherit;opacity:.75}
/* teacher */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.bar h2{font-size:22px;margin-inline-end:auto}
.split{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list h3{font-size:13.5px;color:var(--muted);font-family:var(--body);font-weight:700;padding:10px 14px 4px;background:var(--bg);border-top:1px solid var(--line)}
.list h3:first-child{border-top:0}
.srow{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:right}
.srow:hover{background:var(--gold-soft)}
.srow.on{background:var(--gold-soft);box-shadow:inset -4px 0 0 var(--gold)}
.srow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addst{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.editor{display:flex;flex-direction:column;gap:16px;min-width:0}
.ehead{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ehead h2{font-size:24px;margin-inline-end:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:16px}
.lbl{font-size:13px;color:var(--muted);font-weight:600}
.skills{display:flex;flex-direction:column}
.sk{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.sk:first-child{border-top:0}
.sk .t{min-width:0}
.tg{border:1.5px solid var(--line);background:transparent;border-radius:8px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.tg[aria-pressed="true"].s{background:var(--ok);border-color:var(--ok);color:#fff}
.tg[aria-pressed="true"].w{background:var(--warn);border-color:var(--warn);color:#fff}
.grp{font-family:var(--display);font-size:14px;margin-top:6px;color:var(--gold-ink);background:var(--gold-soft);padding:4px 10px;border-radius:6px;align-self:flex-start}
.count{display:flex;gap:14px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.count b{color:var(--ink)}
textarea{width:100%;min-height:110px;resize:vertical;line-height:1.7}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{font-size:13.5px;color:var(--muted)}
.empty{color:var(--muted);padding:40px 16px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
/* preview sheet: a document, fixed light colors on purpose */
.pvwrap{overflow-x:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.pvscale{width:397px;height:562px;overflow:hidden;margin:0 auto}
.pvscale .sheet{transform:scale(.5);transform-origin:top right}
.sheet{width:794px;height:1123px;background:#FFFFFF;color:#16130E;font-family:var(--body);direction:rtl;display:flex;flex-direction:column;position:relative;overflow:hidden}
.sh-top{background:#E8C04E;padding:36px 56px 30px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.sh-top img{height:78px;width:auto}
.sh-top .tt{display:flex;flex-direction:column;gap:6px}
.sh-top .tt small{font-size:15px;font-weight:600;background:#16130E;color:#E8C04E;padding:4px 14px;align-self:flex-start}
.sh-top h1{font-family:var(--display);font-size:38px;font-weight:800;color:#16130E}
.sh-info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin:26px 56px 0;border:2px solid #16130E}
.sh-info div{padding:10px 16px;border-bottom:1px solid #E9E2D0;display:flex;gap:10px;font-size:16px}
.sh-info div:nth-child(odd){border-left:1px solid #E9E2D0}
.sh-info div:nth-last-child(-n+2){border-bottom:0}
.sh-info span{color:#6B6253;min-width:70px}
.sh-info b{font-weight:700}
.sh-body{padding:22px 56px 0;display:flex;flex-direction:column;gap:20px;flex:1}
.sh-sec h2{font-family:var(--display);font-size:21px;font-weight:800;display:flex;align-items:center;gap:12px;padding-bottom:8px;border-bottom:3px solid #E8C04E;margin-bottom:10px}
.sh-sec h2 i{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sh-sec ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.sh-sec li{font-size:17px;line-height:1.6;display:flex;gap:12px}
.sh-sec li::before{content:"";width:9px;height:9px;background:#16130E;flex:none;margin-top:11px}
.sh-sec.st h2 i{background:#E8C04E}
.sh-sec.im h2 i{background:#16130E}
.sh-noteb{background:#FBF3D9;padding:16px 20px;font-size:17px;line-height:1.8;min-height:90px}
.sh-noteb p{margin:0}
.sh-sign{display:flex;justify-content:space-between;font-size:15px;color:#6B6253;margin-top:auto;padding-top:10px}
.sh-foot{margin:18px 56px 34px;border-top:3px solid #16130E;padding-top:14px;display:flex;justify-content:space-between;align-items:center;font-size:15px}
.sh-foot b{font-family:var(--display)}
.sh-foot span.p{background:#16130E;color:#E8C04E;padding:5px 14px;font-weight:700}
.sh-empty{color:#9A8F7A;font-size:16px}
/* reception */
.rtable{width:100%;border-collapse:collapse;background:var(--surface);font-size:14.5px}
.rtable th,.rtable td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
.rtable th{font-size:13px;color:var(--muted);background:var(--bg);font-weight:700}
.rtable td.ph{font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-weight:600;font-size:14px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13.5px;color:var(--muted)}
.stat b{font-family:var(--display);font-size:20px;color:var(--ink);margin-inline-start:6px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-weight:600;z-index:20}
/* teacher workspace v2 */
.tw{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.tw{grid-template-columns:minmax(0,1fr)}.tw.has-sel .side{display:none}.tw:not(.has-sel) .main{display:none}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 100px)}
@media (max-width:860px){.side{position:static;max-height:none}}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.prog .row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted)}
.prog .row b{font-family:var(--display);font-size:20px;color:var(--ink)}
.pbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.filters{display:flex;gap:8px}
.filters input{flex:1;min-width:0}
.filters select{max-width:46%}
.list{overflow-y:auto;min-height:120px}
@media (max-width:860px){.list{overflow:visible}}
.list h3{position:sticky;top:0;z-index:1}
.srow .nm{font-weight:500}
.addbtn{border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px;color:var(--muted);font-weight:600}
.addbtn:hover{border-color:var(--gold);color:var(--ink)}
.addst{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.shead{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.shead h2{font-size:22px}
.shead .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-inline-end:auto}
.back{display:none}
@media (max-width:860px){.back{display:inline-flex}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step>header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.step>header .n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.step>header h3{font-size:16px;margin-inline-end:auto}
.step>header .c{font-size:13px;color:var(--muted)}
.step>header .c b{color:var(--ink)}
.step .body{padding:10px 16px 14px;display:flex;flex-direction:column;gap:6px}
.sub{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:6px}
.cl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (max-width:640px){.cl{grid-template-columns:minmax(0,1fr)}}
.ck{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;line-height:1.5;min-width:0}
.ck:hover{border-color:var(--gold)}
.ck input{position:absolute;opacity:0;pointer-events:none}
.ck .bx{width:20px;height:20px;border:2px solid var(--muted);border-radius:5px;flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center}
.ck input:checked+.bx{background:var(--ok);border-color:var(--ok)}
.ck.w input:checked+.bx{background:var(--warn);border-color:var(--warn)}
.ck input:checked+.bx::after{content:"";width:10px;height:6px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.ck input:focus-visible+.bx{outline:3px solid var(--gold);outline-offset:2px}
.ck.on{background:var(--ok-soft);border-color:var(--ok)}
.ck.w.on{background:var(--warn-soft);border-color:var(--warn)}
.ck.dis{opacity:.4;cursor:not-allowed}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.savebar .msg{margin-inline-end:auto}
@media (max-width:640px){.savebar{gap:6px;padding:8px}.savebar .msg{display:none}.savebar .btn{flex:1;padding:7px 6px;font-size:13.5px}.top .wrap{gap:8px}.top h1{font-size:16px}}
.modal{position:fixed;inset:0;z-index:30;background:rgba(22,19,14,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px}
.modal .card{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;max-width:100%}
.modal .card .actions{justify-content:space-between}
.pvscale{width:min(530px,calc(100vw - 60px));aspect-ratio:794/1123;height:auto;overflow:hidden;position:relative}
.pvscale .sheet{position:absolute;top:0;right:0;transform-origin:top right}
#render{position:fixed;left:-10000px;top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <img id="topLogo" alt="بالقلم">
  <h1>متابعة الطلاب</h1>
  <span class="sp"></span>
  <label class="who" for="period">الشهر
    <select id="period"></select></label>
  <div class="who" id="whoBox" hidden><span id="whoName"></span><button class="btn sm" id="logout" type="button">خروج</button></div>
</div></header>

<main class="wrap" id="app">
  <div class="empty" id="boot">جاري تحميل الطلاب…</div>
</main>
<div id="render" aria-hidden="true"></div>
<div class="toast" id="toast" hidden></div>
